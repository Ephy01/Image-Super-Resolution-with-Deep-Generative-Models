# Frozen settings for the final test run. Do not edit: the SHA-256 is in final.yaml.sha256 and is checked before every test run.
paths:
  data: data
  weights: models
  outputs: outputs
  results: results
  third_party: third_party
  cache: data/cache
data:
  seed: 42
  hr_size: 512
  scale: 4
  jpeg_qualities:
  - none
  - 50
  - 30
  - 10
  jpeg_subsampling: 2
methods:
- bicubic
- realesrnet
- realesrgan
- resshift
rrdbnet:
  weights:
    realesrnet: RealESRNet_x4plus.pth
    realesrgan: RealESRGAN_x4plus.pth
  precision: float32
  batch_size: 1
  tiling: none
resshift:
  version: v3
  official_commit: bb03b7d21614cace01787e097c8a6ab6b945227d
  model_weights: resshift_realsrx4_s4_v3.pth
  autoencoder_weights: autoencoder_vq_f4.pth
  steps: 4
  precision: float32 weights, float16 autocast
  amp: true
  seed_policy: (crc32(image_id) + offset) & 0x7fffffff, the same seed for every JPEG level
  seed_offset: 0
  seed_offsets:
  - 0
  - 1
  - 2
  - 3
  - 4
runtime:
  warmup_runs: 3
  bicubic_device: cpu
metrics:
  psnr_ssim:
    channel: Y (BT.601)
    crop_border: 4
  lpips:
    net: alex
    version: '0.1'
  musiq:
    library: pyiqa
    metric: musiq
    device: cpu
    checkpoint:
      file: musiq_koniq_ckpt-e95806b9.pth
      sha256: e95806b9eae5f3814c410f574ba8e552362bd5bc63d758ed5b97860f5d6185aa
  ocr:
    engine: tesseract
    lang: eng
    normalisation: collapse every whitespace run to one space, strip; case-sensitive
    cer: Levenshtein distance / reference length, not capped
    candidates:
      psm:
      - 3
      - 4
      - 6
      oem:
      - 1
      - 3
      preprocess:
      - none
      - otsu
      - upscale2_otsu
    selected:
      psm: 4
      oem: 1
      preprocess: none
    tesseract: tesseract 5.5.1
    tessdata_sha256: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2
  arcface:
    library: insightface
    model_pack: buffalo_l
    det_size_candidates:
    - 512
    - 640
    - 320
    det_size: 512
    det_thresh: 0.5
    face: largest detected face
    false_match_rate: 0.01
    threshold: 0.1819307956740638
    match: similarity > threshold
    detection_failure: similarity missing (excluded from the mean, counted); counted as a non-match in the match rate
    models_sha256:
      1k3d68.onnx: df5c06b8a0c12e422b2ed8947b8869faa4105387f199c477af038aa01f9a45cc
      2d106det.onnx: f001b856447c413801ef5c42091ed0cd516fcd21f2d6b79635b1e733a7109dbf
      det_10g.onnx: 5838f7fe053675b1c7a08b633df49e7af5495cee0493c7dcf6697200b85b5b91
      genderage.onnx: 4fde69b1c810857b88c64a335084f1c3fe8f01246c9a191b48c7bb756d6652fb
      w600k_r50.onnx: 4c06341c33c2ca1f86781dab0e829f88ad5b64be9fba56e56bc9ebdefc619e43
statistics:
  bootstrap_samples: 10000
  seed: 42
  confidence: 0.95
  interval: percentile endpoints [lo, hi]
  correction: none (pointwise intervals)
analysis:
  generative:
  - realesrgan
  - resshift
  reference: realesrnet
  jpeg_hypothesis:
    statement: all models degrade sharply below JPEG quality 30
    per_image: drop_low = M(30) - M(10), drop_high = M(50) - M(30), signed so that a positive drop is a loss (LPIPS sign flipped)
    statistic: mean of (drop_low - drop_high) over images, paired percentile bootstrap
    metrics:
    - psnr
    - ssim
    - lpips
    verdict: supported if lo > 0 for all 3 metrics; not supported if lo > 0 for none; mixed otherwise
    unit: each method x content type
  hypothesis_checks:
    sharper_but_lower_psnr: generative - reference, JPEG none and 10; LPIPS hi < 0, MUSIQ lo > 0, PSNR hi < 0
    invented_letters: generative - reference on text, JPEG none and 10, also by HR font size; CER lo > 0 while LPIPS hi < 0
    identity_change: generative - reference on faces, JPEG none and 10; ArcFace similarity hi < 0; match rate reported
    jpeg_below_30: see jpeg_hypothesis
  failure_cases:
    a: text, any JPEG level; LPIPS ranks a generative method best of the 4 and its CER is the worst of the 4; take the case with the largest CER
      gap to the best-CER method
    b: faces, JPEG none; the lowest ArcFace similarity of any generative method (detection failures are listed separately)
    c: JPEG 10, any content; the largest PSNR deficit of a generative method below bicubic
    d: ResShift, HR font size 16, JPEG none; the highest ResShift CER, ties by the largest CER gap to Real-ESRNet
    crop: 128x128 HR pixels centred on the maximum of the 31x31 box-filtered absolute Y error of the failing method
    fallback: if no image meets rule a, report "no case" and keep b, c and d
frozen:
  date: '2026-11-01'
  selected_on: dev split only (64 images); see results/analysis/*_dev.json
  test_split_note: an exploratory all-method run on test exists from cc9a873 (results/legacy_colab/); none of its numbers were used to choose
    any setting
